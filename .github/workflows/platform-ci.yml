name: Platform CI

# Lint, type-check and test the FastAPI platform service, then check that its
# Docker image builds. Runs only when platform/ (or this file) changes.

on:
  push:
    branches: [dev, prod]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    branches: [dev, prod]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-retries 20

    env:
      # CI runs in local mode (throwaway DB, dev secrets); the app defaults to prod.
      PLATFORM_ENV: local
      PLATFORM_DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/platform
      PLATFORM_REDIS_URL: redis://localhost:6379/0
      PLATFORM_TEST_SERVICES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Mypy
        run: mypy app

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t platform-api:ci .

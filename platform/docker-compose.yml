# Local development stack. Not used in Kubernetes.
services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: &app-env
      PLATFORM_ENV: local
      PLATFORM_DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/platform
      PLATFORM_REDIS_URL: redis://redis:6379/0
      PLATFORM_SMTP_HOST: mailpit
      PLATFORM_SMTP_PORT: "1025"
    env_file: &app-env-file
      - path: .env
        required: false
    ports: ["${API_PORT:-8000}:8000"]
    volumes: &app-volumes
      - ./app:/srv/app
      - ./alembic:/srv/alembic
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Background jobs: deposit expiry (every 5 min), daily reconciliation.
  worker:
    build: .
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment: *app-env
    env_file: *app-env-file
    volumes: *app-volumes
    depends_on: *app-deps

  beat:
    build: .
    command: celery -A app.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *app-env
    env_file: *app-env-file
    volumes: *app-volumes
    depends_on: *app-deps

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["127.0.0.1:${PG_PORT:-55433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Catches magic-link emails locally: http://localhost:58025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${MAIL_UI_PORT:-58025}:8025", "127.0.0.1:${SMTP_PORT:-51025}:1025"]

volumes:
  pgdata:
